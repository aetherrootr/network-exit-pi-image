name: Build image and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a Release after a successful build (default: upload artifact only)'
        type: boolean
        default: false
      release_tag:
        description: 'Required only for publishing, e.g. v0.1.0; a new tag points to the built commit'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: image-${{ github.event_name == 'push' && github.ref_name || (inputs.publish_release && inputs.release_tag || github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || (inputs.publish_release && inputs.release_tag || format('build-{0}-{1}', github.run_number, github.run_attempt)) }}
      release: ${{ github.event_name == 'push' || inputs.publish_release }}
    secrets:
      OTA_SIGNING_CERT: ${{ secrets.OTA_SIGNING_CERT }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}

  release:
    if: github.event_name == 'push' || inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: image-packages
          path: dist
      - name: Publish complete flash package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          BUILD_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Validate all downloaded assets before creating or changing a draft.
          python3 - <<'ASSET_SIZES'
          from pathlib import Path
          files = sorted(Path('dist').iterdir())
          if not files:
              raise SystemExit('No release assets were downloaded')
          for path in files:
              size = path.stat().st_size
              print(f'{path.name}: {size} bytes', flush=True)
              if not path.is_file() or size >= 2 * 1024 ** 3:
                  raise SystemExit(f'Release asset must be a regular file smaller than 2 GiB: {path.name}')
          ASSET_SIZES
          # Existing tags (including annotated tags) must resolve to the built commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag-state.json 2> tag-error.txt; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            [[ $tag_commit == "$BUILD_SHA" ]] || {
              echo 'The tag points to a different commit; refusing to publish this build.' >&2
              exit 1
            }
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to modify an already published release"'
          else
            cat > release-notes.md <<'NOTES'
          Fully preinstalled Orange Pi Zero 3 / Debian 13 ARM64 image.

          The factory package stores one rootfs payload. Its included writer streams it into both independent A/B slots and verifies every written region. Use the included Linux writer rather than a generic raw-image flashing tool. OTA remains a separately signed RAUC bundle.

          For initial provisioning, download network-exit-factory-*.tar.gz, extract it, enter its directory, and run on Linux:

          ```bash
          ./burn.sh /dev/xxx --ssh-key ~/.ssh/id_ed25519.pub
          ```

          Provide your pi login SSH public key and a whole-card device path. The script verifies the image, rejects mounted devices, requests sudo, asks for confirmation, writes the image, and verifies it by reading it back. All SD card data will be overwritten.

          The first interactive pi SSH login automatically opens the setup wizard. Tailscale is mandatory and supports the official control plane or Headscale. WireGuard, Cloudflare Tunnel and sing-box are preinstalled optional capabilities selected in that wizard. For an existing A/B device, invoke enodectl update manually to check and install the signed network-exit-ota-*.raucb package. No unattended image installation is enabled. See README for trial boots, confirmation and rollback.
          NOTES
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --target "$BUILD_SHA" --draft=false
