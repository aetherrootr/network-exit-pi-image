[Unit]
Requires=network-exit-state.service network-exit-network.service network-exit-guard.service
Wants=network-online.target
After=network-exit-state.service network-exit-network.service network-exit-guard.service network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
TimeoutStartSec=90s
TimeoutStopSec=30s
Environment=WG_ENDPOINT_RESOLUTION_RETRIES=5
