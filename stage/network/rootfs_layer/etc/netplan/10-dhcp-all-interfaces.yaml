network:
  version: 2
  renderer: networkd
  ethernets:
    all-eth-interfaces:
      match: {name: "e*"}
      dhcp4: true
      dhcp6: true
      optional: true
      ipv6-privacy: true
      link-local: [ipv6]
      dhcp4-overrides: {route-metric: 100}
      dhcp6-overrides: {route-metric: 100}
    all-lan-interfaces:
      match: {name: "lan*"}
      dhcp4: true
      dhcp6: true
      optional: true
      link-local: [ipv6]
      dhcp4-overrides: {route-metric: 100}
      dhcp6-overrides: {route-metric: 100}
    all-wan-interfaces:
      match: {name: "wan*"}
      dhcp4: true
      dhcp6: true
      optional: true
      link-local: [ipv6]
      dhcp4-overrides: {route-metric: 100}
      dhcp6-overrides: {route-metric: 100}
