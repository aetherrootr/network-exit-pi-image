PermitRootLogin no
DenyUsers root
AllowUsers pi
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
KbdInteractiveAuthentication no
UsePAM yes
# Empty or absent trust allows only ordinary authorized_keys; CA private keys
# are never stored on the appliance. With no principals override, login requires pi.
TrustedUserCAKeys /etc/network-exit/ssh-user-ca.pub
AuthorizedPrincipalsFile none
AuthorizedPrincipalsCommand none
